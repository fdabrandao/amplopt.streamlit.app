title = "Logistic regression (nonlinear)"
order = 2
summary = """
Fit a credit-approval classifier: find the weights that minimize the regularized logistic loss
over 50 past applicants (3 standardized features). The loss uses log and exp, so this is a
nonlinear model.
"""

# Objective shared by every implementation (validated by validate.py).
expected_objective = 16.902616
rel_tol = 1e-5

# Solvers AMPL is validated with, using the exact same model.mod (only `option solver` changes).
ampl_solvers = ["ipopt", "knitro", "gurobi"]

# AMPL solver -> solver whose solution is used as its starting point (validation).
# Gurobi's global search proves optimality in about 15 s from the Ipopt solution; from a cold start
# the Gurobi 13.0.3 bundled with AMPL (latest module, 20261029) leaves an ~12% gap after 10 minutes.
[warm_start]
gurobi = "ipopt"

# Tools that cannot express this model: tool -> reason shown on the page.
[not_supported]
docplex = "docplex models linear and quadratic problems; the log and exp terms of the logistic loss cannot be expressed."
highspy = "HiGHS solves linear, mixed-integer and convex quadratic problems; the log and exp terms of the logistic loss cannot be expressed."
pulp = "PuLP models linear and mixed-integer problems only."

# Implementations that exist but could not be validated with the licenses available: tool -> reason.
[license_limited]
xpress = "Not validated: the free Xpress community license does not include Xpress-NLP and limits nonlinear formulas to 1,000 tokens. Validation needs a full Xpress license."

# Booth headline: three facts shown in large type above the code.
[[headline]]
value = "1 formula"
label = "the loss is written as the math: log, exp and sums"

[[headline]]
value = "3 of 6"
label = "Python tools compared here cannot express this model"

[[headline]]
value = "3 solvers"
label = "Ipopt, Knitro and Gurobi run the same AMPL model"

# Notes shown next to the code (also the presenter's script). `at` is "header" or a block name
# (sets, params, vars, objective, constraints, data, solve); `tools` limits a note to comparisons
# with those tools. Inline `code` is allowed.
[[notes]]
at = "header"
text = """The same AMPL model runs with Ipopt (open source), Knitro and Gurobi: switching solvers is
one line."""

[[notes]]
at = "objective"
text = """The loss is written as the formula, with `log`, `exp` and sums. AMPL passes it to nonlinear
solvers and computes the derivatives they need automatically."""

[[notes]]
at = "objective"
tools = ["gurobipy"]
text = """Gurobi's nonlinear functions come from `gurobipy.nlfunc`; the model runs on Gurobi only."""

[[notes]]
at = "objective"
tools = ["xpress"]
text = """`xp.log` and `xp.exp` are Xpress functions; the model runs on Xpress, with its nonlinear
solver license."""

[[notes]]
at = "objective"
tools = ["pyomo"]
text = """Pyomo writes the formula in a similar way, with `pyo.log` and `pyo.exp`, and passes it to a
nonlinear solver (Ipopt here)."""
