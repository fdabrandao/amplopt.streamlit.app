title = "Production planning with business rules"
order = 1
summary = """
Weekly production plan for a snack-bar line (8 products, 8 weeks). On top of a classic
lot-sizing model, the plan must follow five business rules: minimum lot sizes, at most
4 products per week, allergen conflicts, a reorder-point rule, and smooth/level production.
"""

# Objective shared by every implementation (validated by validate.py).
expected_objective = 37017.1014
rel_tol = 1e-6

# Solvers AMPL is validated with, using the exact same model.mod (only `option solver` changes).
ampl_solvers = ["highs", "gurobi", "cplex", "xpress", "cbc", "scip"]

# Tools that cannot express this model: tool -> reason shown on the page.
[not_supported]

# Reviewer notes explaining non-obvious choices in an implementation (not shown on the page).
[internal_notes]
pulp = "Solved with PuLP's HiGHS interface: the CBC 2.10.3 build bundled with PuLP 3.3.2 stops at a suboptimal plan (37,062.07) on this model."
xpress = "The objective is set after the indicator constraints: with xp.abs()/xp.max() in the objective, xpress 10.0.0 attaches indicators added afterwards to the wrong rows."

# Booth headline: three facts shown in large type above the code.
[[headline]]
value = "1 statement"
label = "per business rule in AMPL, written the way the planner states it"

[[headline]]
value = "6 solvers"
label = "run this exact model; switching is one line of code"

[[headline]]
value = "7 tools"
label = "implement this same model on this page"

# Notes shown next to the code (also the presenter's script). `at` is "header" or a block name
# (sets, params, vars, objective, constraints, data, solve); `tools` limits a note to comparisons
# with those tools. Inline `code` is allowed.
[[notes]]
at = "header"
text = """The AMPL model runs unchanged with HiGHS, Gurobi, CPLEX, Xpress, CBC or SCIP: switching
solvers is one line (`ampl.option["solver"]`)."""

[[notes]]
at = "header"
tools = ["gurobipy", "docplex", "xpress", "highspy"]
text = """Each solver-native API is tied to its own solver: using another solver means rewriting the
model with another API."""

[[notes]]
at = "objective"
text = """AMPL writes `abs(...)` (week-to-week change) and `max {...}` (busiest week) directly in the
objective."""

[[notes]]
at = "objective"
tools = ["gurobipy"]
text = """gurobipy's `abs_()` and `max_()` accept variables only, so the differences and weekly loads
first get their own variables and defining constraints."""

[[notes]]
at = "objective"
tools = ["docplex", "xpress"]
text = """`abs` and `max` are accepted in the objective, as functions of this solver's API."""

[[notes]]
at = "objective"
tools = ["pyomo", "pulp", "highspy"]
text = """`abs` and `max` are rewritten by hand: extra variables and two or more constraints for each
term."""

[[notes]]
at = "constraints"
text = """Each business rule is one statement that reads like the rule: at most 4 products a week
(`count ... <= max_products`), conflicting products never in the same week (`or`), produce next week
when stock falls below the reorder point (`Inv < reorder ==> Make > 0`)."""

[[notes]]
at = "constraints"
tools = ["gurobipy", "docplex", "xpress"]
text = """The rules go through on/off variables (`run`) linked to the quantities. The reorder rule is
written as an indicator constraint on its contrapositive: not running next week means stock at or
above the reorder point."""

[[notes]]
at = "constraints"
tools = ["highspy", "pulp"]
text = """The rules go through on/off variables (`run`) linked to the quantities. The reorder rule is
linearized by hand as a big-M constraint on its contrapositive: not running next week means stock at
or above the reorder point."""

[[notes]]
at = "constraints"
tools = ["pyomo"]
text = """Pyomo states the rules as disjunctions (each product-week running or idle) and logical
constraints, then reformulates them with `gdp.bigm` before solving. The reorder rule is written as
its contrapositive."""

[[notes]]
at = "data"
text = """Every implementation reads the same CSV files. The AMPL model file has no data-handling code;
the data is attached with a few amplpy calls."""
