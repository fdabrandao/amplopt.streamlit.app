title = "Production planning with business rules"
order = 1
summary = """
Weekly production plan for a snack-bar line (8 products, 8 weeks). On top of a classic
lot-sizing model, the plan must follow five business rules: minimum lot sizes, at most
4 products per week, allergen conflicts, a reorder-point rule, and smooth/level production.
"""

# Objective shared by every implementation (validated by validate.py).
expected_objective = 37017.1014
rel_tol = 1e-6
objective_label = "Total cost"

# Solvers AMPL is validated with, using the exact same model.mod (only `option solver` changes).
ampl_solvers = ["highs", "gurobi", "cplex", "xpress", "cbc", "scip"]

# Variables shown after a live AMPL solve: name -> caption.
[display]
Make = "Production plan (units per week)"

# Tools that cannot express this model: tool -> reason shown on the page.
[not_supported]

# Reviewer notes explaining non-obvious choices in an implementation (not shown on the page).
[internal_notes]
pulp = "Solved with PuLP's HiGHS interface: the CBC 2.10.3 build bundled with PuLP 3.3.2 stops at a suboptimal plan (37,062.07) on this model."
xpress = "The objective is set after the indicator constraints: with xp.abs()/xp.max() in the objective, xpress 10.0.0 attaches indicators added afterwards to the wrong rows."

# Booth headline: three facts shown in large type above the code.
[[headline]]
value = "1 statement"
label = "per business rule in AMPL, written the way the planner states it"

[[headline]]
value = "6 solvers"
label = "run this exact model; switching is one line of code"

[[headline]]
value = "7 tools"
label = "implement it here, all checked to reach the same optimal cost"

# For the sales rep: what to point at, and what to say (Markdown).
[[talking_points]]
point = "the *Constraints* row, AMPL column."
say = """Each business rule is one line that reads like the rule itself: at most 4 products a week,
Nut and Oat never in the same week, produce when stock falls below the reorder point
(`Inv < reorder ==> Make > 0`). The other columns express the same rules through extra on/off
variables (`run`), linking constraints and, for the reorder rule, its contrapositive."""

[[talking_points]]
point = "the *Objective* row."
say = """AMPL writes `abs(...)` and `max {...}` directly in the objective. gurobipy needs helper
variables because `abs_()` and `max_()` accept variables only. Pyomo, PuLP and highspy rewrite them
by hand as extra constraints. docplex and xpress accept them, each for its own solver."""

[[talking_points]]
point = "the *Solver* chips and the live solve."
say = """This exact AMPL model was validated with HiGHS, Gurobi, CPLEX, Xpress, CBC and SCIP, and
switching is one line. Each solver-native API is tied to its own solver, so switching solvers means
rewriting the model."""

[[talking_points]]
point = "the *Add a new rule* toggle."
say = """A planner asks for a crew-rest rule: after a week of more than 50 line hours, the next week
runs at most 45. In AMPL that is two parameters and one constraint, written the way the planner said it,
and the data loading code does not change. The highlighted lines show what the same request costs in the other
tool: a new binary variable, indicator or big-M constraints, and the parameter plumbing."""

[[talking_points]]
point = "the green badges."
say = """Every implementation reaches the same optimal cost, so the difference is only in how the
model is written."""
