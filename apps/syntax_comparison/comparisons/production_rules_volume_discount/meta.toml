title = "Production planning with business rules + volume discounts"
order = 1
variant_of = "production_rules"
change_name = "Volume discounts"
change = "Volume discount: units beyond 1,000 a week cost 15% less, units beyond 2,500 cost 30% less"
summary = """
Weekly production plan for a snack-bar line (8 products, 8 weeks). On top of a classic
lot-sizing model, the plan must follow five business rules: minimum lot sizes, at most
4 products per week, allergen conflicts, a reorder-point rule, and smooth/level production.
"""

# Objective shared by every implementation (validated by validate.py).
expected_objective = 36234.3967
rel_tol = 1e-6

# Solvers AMPL is validated with, using the exact same model.mod (only `option solver` changes).
ampl_solvers = ["gurobi", "cplex", "xpress", "highs", "cbc", "scip"]

# Tools that cannot express this model: tool -> reason shown on the page.
[not_supported]

# Notes shown next to the code (also the presenter's script). `at` is "header" or a block name
# (sets, params, vars, objective, constraints, data, solve); `tools` limits a note to comparisons
# with those tools. Inline `code` is allowed.
[[notes]]
at = "objective"
text = """Volume discount: one piecewise-linear term, `<< breakpoints; prices >> Make[p,t]`, written
like the price sheet. A falling price makes the cost concave; AMPL handles that without any
reformulation by the modeler, whichever solver is used."""

[[notes]]
at = "objective"
tools = ["gurobipy"]
text = """`setPWLObj()` takes (x, y) points, so the tiers are first turned into cost-curve points in
Python (`cost_curve`). It is called after `setObjective()`, which would otherwise reset it."""

[[notes]]
at = "objective"
tools = ["docplex"]
text = """`piecewise_as_slopes()` takes (slope, breakpoint) pairs: one piecewise-linear function per
product, applied to each quantity."""

[[notes]]
at = "objective"
tools = ["xpress"]
text = """`xp.pwl()` takes one linear piece per interval, so each piece's starting cost is computed in
Python (`discounted_cost`)."""

[[notes]]
at = "objective"
tools = ["highspy", "pulp"]
text = """No piecewise-linear support: each lot is split into price segments by hand, with binaries
forcing each segment to fill before the next, cheaper one is used."""

[[notes]]
at = "objective"
tools = ["pyomo"]
text = """A `Piecewise` component links a cost variable to `Make`. Because the cost is concave, the
modeler picks a representation with binaries (`pw_repn`)."""

# Reviewer notes explaining non-obvious choices in an implementation (not shown on the page).
[internal_notes]
pulp = "Solved with PuLP's HiGHS interface: the CBC 2.10.3 build bundled with PuLP 3.3.2 stops at a suboptimal plan on the base model."
xpress = "The objective is set after the indicator constraints: with xp.abs()/xp.max() in the objective, xpress 10.0.0 attaches indicators added afterwards to the wrong rows."
gurobipy = "setPWLObj() is Gurobi's piecewise-linear objective; setting the variable's linear objective (as setObjective() does) deletes it, so it is called last."
xpress_pwl = "With xp.pwl, the xpress 10.0.0 Python API had a 16% gap after the 10-minute validation limit (also slow with xp.pwl in a constraint, and without xp.abs/xp.max); the same model sent by AMPL to Xpress 9.8.1 is proven optimal in about 15 s. xp.pwl is kept because it is the idiomatic construct."
